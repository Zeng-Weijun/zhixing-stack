profile: zhixing-coder
version: 0.1

env:
  provider: zhixing-env
  task_family: software_engineering

runtime:
  provider: zhixing-runtime
  tools:
    - search
    - read
    - edit
    - bash
    - run_tests
    - submit

data:
  provider: zhixing-data

train:
  provider: zhixing-train
  backend: slime

bench:
  provider: zhixing-bench
  suites:
    - swebench_verified
    - terminal_bench
